name: Desktop Release (All Platforms)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.25)'
        required: true

env:
  RELEASE_REPO: rust-ui/releases-leptos
  RUSTC_WRAPPER: ""

jobs:
  build-macos:
    runs-on: macos-latest
    name: Build macOS (Apple Silicon)
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "value=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri
        working-directory: src-tauri
        # leptos-ui/.cargo/config.toml sets `-fuse-ld=lld` for aarch64-apple-darwin
        # (dev-machine convenience, cargo inherits it here since src-tauri is a
        # subdirectory). GitHub's macOS runner doesn't have lld installed. RUSTFLAGS
        # is the only override that reliably beats the inherited config value here
        # (CARGO_TARGET_<triple>_RUSTFLAGS is same-precedence as the config file
        # entry it's meant to replace, so it didn't take).
        env:
          RUSTFLAGS: ""
        run: cargo tauri build --target aarch64-apple-darwin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-linux:
    runs-on: ubuntu-22.04
    name: Build Linux (x86_64)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Tauri CLI
        # Building tauri-cli from source fails: it pulls clap -> textwrap ->
        # terminal_size 0.2.x, which hard-pins rustix ^0.37 in its own Cargo.toml
        # (a real semver constraint, not a stale lockfile). rustix 0.37.x uses
        # internal rustc attributes (rustc_layout_scalar_valid_range_*) that current
        # rustc hard-rejects on any channel (not an unstable-feature gate, so
        # RUSTC_BOOTSTRAP=1 doesn't help either). Use the prebuilt binary from the
        # tauri release instead of compiling from source.
        run: |
          curl -sL "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.5/cargo-tauri-x86_64-unknown-linux-gnu.tgz" | tar xz
          sudo mv cargo-tauri /usr/local/bin/
          cargo tauri --version

      - name: Build Tauri
        working-directory: src-tauri
        run: cargo tauri build --target x86_64-unknown-linux-gnu

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

  build-windows:
    runs-on: windows-latest
    name: Build Windows (x64)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri
        working-directory: src-tauri
        run: cargo tauri build --target x86_64-pc-windows-msvc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  release:
    runs-on: ubuntu-22.04
    name: Upload to GitHub Release
    needs: [build-macos, build-linux, build-windows]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Normalize asset filenames
        run: |
          # Tauri bakes the version into bundle filenames (e.g. Rust.UI_0.1.24_amd64.AppImage).
          # rust-ui.com's download page links to "latest/download/<static-name>", which requires
          # a filename that doesn't change between releases. Rename here instead of chasing the
          # version on the website side.
          #
          # merge-multiple keeps each artifact's own internal directory structure
          # (appimage/, deb/, msi/, nsis/), so the bundle files land in nested dirs,
          # not directly under bundles/ — glob recursively (globstar) instead of
          # bundles/*.ext.
          shopt -s nullglob globstar
          for f in bundles/**/*.dmg; do mv "$f" bundles/rust-ui.dmg; done
          for f in bundles/**/*.AppImage; do mv "$f" bundles/rust-ui_amd64.AppImage; done
          for f in bundles/**/*.deb; do mv "$f" bundles/rust-ui_amd64.deb; done
          for f in bundles/**/*.msi; do mv "$f" bundles/rust-ui_x64_en-US.msi; done
          for f in bundles/**/*.exe; do mv "$f" bundles/rust-ui_x64-setup.exe; done
          ls -la bundles/

      - name: Create release if not exists
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION="${{ needs.build-macos.outputs.version }}"
          gh release view "$VERSION" --repo $RELEASE_REPO || \
            gh release create "$VERSION" \
              --repo $RELEASE_REPO \
              --title "Rust UI $VERSION" \
              --notes "📦 Rust UI Desktop — macOS (Apple Silicon) · Linux (x86_64) · Windows (x64)"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          shopt -s nullglob
          gh release upload "${{ needs.build-macos.outputs.version }}" \
            bundles/rust-ui.dmg \
            bundles/rust-ui_amd64.AppImage \
            bundles/rust-ui_amd64.deb \
            bundles/rust-ui_x64_en-US.msi \
            bundles/rust-ui_x64-setup.exe \
            --repo $RELEASE_REPO \
            --clobber
