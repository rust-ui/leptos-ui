# =============================================================================
#  leptos-ui — production reverse proxy (reference copy)
# =============================================================================
#
#  FLOW:  Browser → Cloudflare (proxied) → host nginx :80/:443 → leptos-ui-app-1
#
#  This repo's deploy (deploy_prod.sh → .github/workflows/prod-vps.yml) builds
#  `everlabs/leptos-ui:latest` and runs it on the shared server as the container
#  `leptos-ui-app-1`, published on 127.0.0.1:4002 (container listens on :3000,
#  Dockerfile `EXPOSE 3000` / `LEPTOS_SITE_ADDR=0.0.0.0:3000`).
#
#  The LIVE vhost lives on the server in /etc/nginx/conf.d/rust-ui.conf. This
#  file is the source-of-truth mirror of the leptos-owned block so the routing
#  is documented alongside the code. Keep the two in sync when either changes.
#
#  DOMAIN OWNERSHIP (first phase — leptos-ui owns the apex too):
#    rust-ui.com, www.rust-ui.com  ─┐
#    leptos.rust-ui.com            ─┴─→ 127.0.0.1:4002   (this app, one container)
#    dioxus.rust-ui.com               → 127.0.0.1:5000   (separate: rust-ui/dioxus-ui)
#
#  LATER (when Dioxus takes over the apex): move the `rust-ui.com
#  www.rust-ui.com` names out of the server_name lines below and into the Dioxus
#  block. `leptos.rust-ui.com` stays here permanently.
#
#  TLS: one Let's Encrypt cert covers all three leptos names
#    certbot --nginx -d rust-ui.com -d www.rust-ui.com -d leptos.rust-ui.com
#  (cert dir is named after the first -d domain: /etc/letsencrypt/live/rust-ui.com/)
#  Cloudflare terminates the public TLS (SSL mode: Full), this cert secures the
#  Cloudflare → origin hop.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout 65;

    # ── HTTP → HTTPS redirect (all leptos-owned names) ───────────────────────
    server {
        listen      80;
        server_name rust-ui.com www.rust-ui.com leptos.rust-ui.com;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS — rust-ui.com + www + leptos.rust-ui.com → leptos-ui-app-1 ─────
    server {
        listen      443 ssl;
        server_name rust-ui.com www.rust-ui.com leptos.rust-ui.com;

        ssl_certificate     /etc/letsencrypt/live/rust-ui.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rust-ui.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # WASM / JS bundle: force revalidation so a client never mixes a stale
        # .js with a freshly deployed .wasm (or vice versa) after a deploy.
        location /pkg/ {
            proxy_pass http://127.0.0.1:4002;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_http_version 1.1;
            add_header Cache-Control "no-cache" always;
        }

        # Everything else → Leptos SSR server. $host is forwarded untouched so
        # the app sees the real domain (canonical URLs, SEO, redirects).
        location / {
            proxy_pass http://127.0.0.1:4002;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_http_version 1.1;
            proxy_connect_timeout 30s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # Cheap liveness endpoint for uptime checks (never hits the app).
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
