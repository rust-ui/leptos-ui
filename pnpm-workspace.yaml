# Supply-chain hardening for this repo's npm tooling (pnpm >= 11).
# pnpm reads its policy settings from this file since 10.16. The npm side here is
# just dev tooling (tailwind CLI, biome); the Rust crates are the real project.
#
# NOTE: pnpm-lock.yaml is gitignored repo-wide, so the lockfile-trust gates
# (trustPolicy / trustLockfile) only act on the locally generated lockfile, not
# a committed one. minimumReleaseAge, strictDepBuilds, blockExoticSubdeps and
# audit still apply at every install.

# Refuse to install any version published less than 7 days ago (10080 min).
minimumReleaseAge: 10080
minimumReleaseAgeStrict: false
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude: []

# Lockfile / registry trust.
trustPolicy: no-downgrade
trustPolicyExclude: []
blockExoticSubdeps: true
trustLockfile: false

# Dependency build scripts. strictDepBuilds makes an unreviewed postinstall a
# hard error, so every dep that ships one must get an explicit entry in
# allowBuilds (pnpm 11 replaced onlyBuiltDependencies / ignoredBuiltDependencies
# with this map: true = allowed to run its install script, false = skipped).
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
allowBuilds:
  # native file-watcher (tailwind --watch); node-gyp build skipped, the prebuilt
  # binary comes from the @parcel/watcher-<platform> optional dep
  "@parcel/watcher": false
  # postinstall is only a funding banner
  core-js: false
  # platform binary comes from the @esbuild/<platform> optional dep
  esbuild: false

audit:
  level: high
